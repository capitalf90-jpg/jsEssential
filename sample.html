<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grocery Total and Follower Counter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <h1 class="mb-4">JavaScript Mini Apps</h1>
    <div class="row g-4">
      <section class="col-12 col-lg-6" aria-labelledby="grocery-heading">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="card-title h4 mb-3" id="grocery-heading">Grocery Total Calculator</h2>
            <div class="mb-3">
              <label class="form-label" for="grocery1">Grocery 1 amount</label>
              <input class="form-control" type="number" id="grocery1" min="0" step="any">
            </div>
            <div class="mb-3">
              <label class="form-label" for="grocery2">Grocery 2 amount</label>
              <input class="form-control" type="number" id="grocery2" min="0" step="any">
            </div>
            <div class="mb-3">
              <label class="form-label" for="grocery3">Grocery 3 amount</label>
              <input class="form-control" type="number" id="grocery3" min="0" step="any">
            </div>
            <button class="btn btn-primary" type="button" onclick="calculateTotal()">Calculate total</button>
            <p class="mt-3 mb-0" id="result" aria-live="polite"></p>
          </div>
        </div>
      </section>

      <section class="col-12 col-lg-6" aria-labelledby="followers-heading">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="card-title h4 mb-3" id="followers-heading">Interactive Follower Counter</h2>
            <p>Account holder: Peter Parker</p>
            <p>Followers: <span id="countDisplay">0</span></p>
            <button class="btn btn-success" type="button" onclick="increaseCount()">Follow</button>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="./scope_lab.js"></script>
  <script src="./followers_count.js"></script>
</body>
</html>
